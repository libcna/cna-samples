<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Racing Game</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
    }

    #game {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
    }

    #surface {
      position: relative;
      width: min(100vw, 800px, calc(100vh * 5 / 3));
      aspect-ratio: 5 / 3;
      max-height: min(100vh, 480px);
      background: #000;
    }

    #canvas {
      width: 100%;
      height: 100%;
      display: block;
      border: 0;
      outline: 0;
      touch-action: none;
    }

    #status {
      position: absolute;
      left: 1rem;
      right: 1rem;
      bottom: 1rem;
      z-index: 1;
      color: #fff;
      font: 700 0.875rem/1.25 sans-serif;
      text-align: center;
      text-shadow: 0 1px 3px #000;
      pointer-events: none;
    }

    #progress {
      position: absolute;
      left: 25%;
      right: 25%;
      bottom: 0.35rem;
      width: 50%;
      height: 0.3rem;
      z-index: 1;
    }

    #start-layer {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: grid;
      place-items: center;
      background: rgba(0, 0, 0, 0.72);
    }

    #start-layer[hidden] {
      display: none;
    }

    #start-button, #fullscreen-button {
      min-width: 10rem;
      min-height: 3.5rem;
      border: 2px solid #fff;
      border-radius: 0.75rem;
      color: #fff;
      background: #c65f00;
      font: 700 1.25rem/1 sans-serif;
      cursor: pointer;
    }

    #fullscreen-button {
      position: fixed;
      top: 0.75rem;
      right: 0.75rem;
      z-index: 3;
      min-width: 7rem;
      min-height: 2.5rem;
      border-radius: 0.5rem;
      background: rgba(198, 95, 0, 0.88);
      font-size: 0.9rem;
    }

    #fullscreen-button[hidden] {
      display: none;
    }
  </style>
</head>
<body>
  <main id="game">
    <div id="surface">
      <canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
      <div id="status" role="status" aria-live="polite">Downloading...</div>
      <progress id="progress" hidden max="100" value="0"></progress>
      <div id="start-layer" hidden>
        <button id="start-button" type="button" disabled>Start race</button>
      </div>
    </div>
    <button id="fullscreen-button" type="button" hidden>Fullscreen</button>
  </main>
  <script>
    const canvasElement = document.getElementById("canvas");
    const statusElement = document.getElementById("status");
    const progressElement = document.getElementById("progress");
    const startLayer = document.getElementById("start-layer");
    const startButton = document.getElementById("start-button");
    const fullscreenButton = document.getElementById("fullscreen-button");

    function setStatus(text) {
      const match = text.match(/([^(]+)\((\d+(?:\.\d+)?)\/(\d+)\)/);
      if (match) {
        statusElement.textContent = match[1].trim();
        progressElement.value = Number(match[2]);
        progressElement.max = Number(match[3]);
        progressElement.hidden = false;
      } else {
        statusElement.textContent = text;
        progressElement.hidden = true;
      }
      statusElement.hidden = !text;
    }

    var Module = {
      canvas: canvasElement,
      noInitialRun: true,
      print: (...values) => console.log(...values),
      printErr: (...values) => console.error(...values),
      setStatus,
      totalDependencies: 0,
      preRun: [() => {
        const dependency = "racing-idbfs";
        Module.racingStorage = "loading";
        Module.addRunDependency(dependency);
        try {
          if (!FS.analyzePath("/save").exists)
            FS.mkdir("/save");
          FS.mount(IDBFS, {autoPersist: true}, "/save");
          FS.syncfs(true, (error) => {
            Module.racingStorage = error ? "failed" : "ready";
            if (error)
              console.error("Racing IDBFS initial sync failed", error);
            Module.removeRunDependency(dependency);
          });
        } catch (error) {
          Module.racingStorage = "failed";
          console.error("Racing IDBFS mount failed", error);
          Module.removeRunDependency(dependency);
        }
      }],
      onRuntimeInitialized() {
        if (Module.racingStorage !== "ready") {
          setStatus("Persistent storage unavailable");
          return;
        }
        startButton.disabled = false;
        startLayer.hidden = false;
        setStatus("Tap Start race to enable audio");
      },
      monitorRunDependencies(remaining) {
        this.totalDependencies = Math.max(this.totalDependencies, remaining);
        setStatus(remaining
          ? `Preparing... (${this.totalDependencies - remaining}/${this.totalDependencies})`
          : "");
      },
    };

    startButton.addEventListener("click", () => {
      Module.racingAudioUnlocked = true;
      Module.racingGameStarted = true;
      startLayer.hidden = true;
      fullscreenButton.hidden = false;
      setStatus("");
      canvasElement.focus();
      Module.callMain([]);
    }, {once: true});

    fullscreenButton.addEventListener("click", () => {
      try {
        delete fullscreenButton.dataset.error;
        Module.requestFullscreen(false, true);
        canvasElement.focus();
      } catch (error) {
        fullscreenButton.dataset.error = String(error);
        setStatus("Fullscreen unavailable");
      }
    });

    canvasElement.addEventListener("webglcontextlost", (event) => {
      event.preventDefault();
      setStatus("WebGL context lost");
    });
    canvasElement.addEventListener("webglcontextrestored", () => setStatus(""));
    window.addEventListener("error", () => setStatus("Error - see browser console"));
    window.addEventListener("unhandledrejection", () =>
      setStatus("Error - see browser console"));
  </script>
  {{{ SCRIPT }}}
</body>
</html>
